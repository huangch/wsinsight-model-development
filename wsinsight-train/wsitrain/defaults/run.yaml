# Default run configuration for wsinsight-train.
# Users override any of these via --config my.yaml or individual CLI flags.
# `input`, `tissue` and `output` are always supplied on the command line.

# segmentation
segmenter: stardist          # cellpose | stardist
cellpose_model: cpsam
diameter: null               # nucleus diameter in MICRONS; null => auto
cellpose_batch_size: 8       # tile batch; lower (4/2) if GPU OOMs
cellpose_flow_threshold: 0.0 # 0 = skip GPU flow QC (avoids whole-slide OOM)

# registration transform
# affine+bspline measured 10-19 points worse than affine on every slide tested:
# the bUnwarpJ field is fitted at 4x downsampling with 8 intervals and only adds
# jitter on top of an already sub-nuclear SIFT affine.
transform: affine            # affine | affine+bspline | none
match_radius_px: 4           # search window for the nucleus lookup (0 = exact pixel)
min_match_rate: 0.35         # slides below this are dropped: their labels are noise
drop_labels: []              # 'background'/'filtered' are unknown-type cells, keep them

# tiling (matches the established CellViT tile contract)
tile_px: 1024
mpp: 0.25
min_cells: 5
bg_thresh: 240.0
overlap: 0.0

# splits / weights
val_frac: 0.20
by_slide: false      # tile-based (stratified per slide) split; true = whole-slide holdout
seed: 42
weight_cap: 10.0

# training
backbone: SAM-H-x40
fold: fold_0
task: sthelar_full
gpus: auto
tune: 0                      # 0 = single run; N = auto-tune iterations

# markers
markers_csv: null            # null => kurtorank bundled default
top_k_markers: 25
