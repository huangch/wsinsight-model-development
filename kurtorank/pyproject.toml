[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kurtorank"
version = "3.1.0"
description = "KurtoRank v3 — unsupervised ensemble subtype annotation for gene-limited spatial transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Chao Hui Huang, Ph.D." },
]
keywords = ["spatial-transcriptomics", "xenium", "cell-annotation", "kurtorank"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  # squidpy>=1.6.3 and spatialdata-io>=0.6 import anndata.io, which needs anndata>=0.11.
  # numpy stays <2 for the shared wsinsight env (cellpose/torch).
  "anndata>=0.11,<0.12",
  "scanpy<1.11",
  "squidpy<1.7",
  "spatialdata>=0.4,<0.5",
  "spatialdata-io>=0.6,<0.7",
  "torch",
  "numpy<2.0.0",
  "zarr<3",
  "xarray<2025",
  "dask>=2024.10.0,<=2024.11.2",
  "distributed>=2024.10.0,<=2024.11.2",
  "pandas",
  "scipy",
  "statsmodels",
  "matplotlib",
  "seaborn",
  "click",
  "tqdm",
  "cellxgene-census",
  "tiledbsoma",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.scripts]
kurtorank = "kurtorank.cli:_main"

[project.urls]
Homepage = "https://github.com/pfizer/kurtorank"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kurtorank = ["markers/data/*.csv"]
