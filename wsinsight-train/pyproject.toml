[build-system]
# setuptools<67 matches wsinsight (the reference for cross-package
# compatibility) and the runtime pin in constraints.txt: >=67 drops
# pkg_resources, which the shared env still needs.
requires = ["setuptools<67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsinsight-train"
version = "0.1.0"
description = "End-to-end, headless CLI to train WSInsight CellViT cell-classification heads from paired Xenium + H&E."
readme = "README.md"
# 3.11 matches wsinsight; every install path (conda-setup.sh, Dockerfile) builds
# py3.11 and the shared env requires it.
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = [
  # numpy 2.x breaks stardist and the pinned cellpose/torch stack.
  "numpy<2.0.0",
  "pandas",
  "pyarrow",
  "pyyaml",
  "scipy",
  "tifffile",
  "pillow",
  "tqdm",
  "kurtorank",
  "cellpose",
]

[project.optional-dependencies]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-autoapi",
  "sphinx-click",
  "sphinx-copybutton",
]
stardist = ["stardist", "tensorflow"]
# zarr lets the tile stage read windows instead of whole slides.
lowmem = ["zarr"]
# 2026-08-24: MCP server surface (`wsinsight-train-mcp` console script). Mirrors
# the sibling `wsinsight[mcp]` / `hplot[mcp]` / `sptxinsight[mcp]` extras so
# every package in the workspace can be driven from an LLM agent via the
# same Model Context Protocol.
mcp = ["fastmcp>=2.0"]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "pre_commit>=3",
]

[project.scripts]
wsitrain = "wsitrain.cli:main"
wsinsight-train-mcp = "wsitrain.mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Same ruleset as wsinsight/sptxinsight, minus their isort force-single-line:
# this package groups its imports and reflowing them all would bury the diff.
extend-exclude = ["scripts/"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
# Every stage imports its heavy deps inside the function body, so the package
# stays importable without a GPU stack.
"wsitrain/stages/__init__.py" = ["E402"]

[tool.setuptools]
packages = ["wsitrain", "wsitrain.stages", "wsitrain.mcp"]

[tool.setuptools.package-data]
wsitrain = ["defaults/*.yaml", "tqdmshim/*.py"]
