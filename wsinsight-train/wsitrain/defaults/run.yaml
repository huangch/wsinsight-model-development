# Default run configuration for wsinsight-train.
# Every key here is also a CLI flag; the flag wins when both are present.
# `input`, `tissue` and `output` are always supplied on the command line.

# segmentation
segmenter: stardist          # cellpose | stardist
cellpose_model: cpsam
stardist_model: 2D_versatile_he
# Parent of the csbdeep model folder, e.g. ~/.keras/models/StarDist2D.
# null falls back to $WSITRAIN_STARDIST_DIR, then $KERAS_HOME/models/StarDist2D,
# then ~/.keras/models/StarDist2D, and finally downloads (needs network access).
stardist_model_dir: null
stardist_cpu: false          # run StarDist on CPU; torch/CellViT keep the GPU
diameter: null               # nucleus diameter in MICRONS; null => auto
cellpose_batch_size: 8       # tile batch; lower (4/2) if GPU OOMs
cellpose_flow_threshold: 0.0 # 0 = skip GPU flow QC (avoids whole-slide OOM)

# registration transform
# affine+bspline measured 10-19 points worse than affine on every slide tested:
# the bUnwarpJ field is fitted at 4x downsampling with 8 intervals and only adds
# jitter on top of an already sub-nuclear SIFT affine.
transform: affine            # affine | affine+bspline | none
match_radius_px: 4           # search window for the nucleus lookup (0 = exact pixel)
min_match_rate: 0.35         # slides below this are dropped: their labels are noise
drop_labels: []              # 'background'/'filtered' are unknown-type cells, keep them

# tiling (matches the established CellViT tile contract)
tile_px: 1024
mpp: 0.25
min_cells: 5
bg_thresh: 240.0
overlap: 0.0

# splits / weights
val_frac: 0.20
by_slide: false      # tile-based (stratified per slide) split; true = whole-slide holdout
seed: 42
weight_cap: 10.0

# training
backbone: SAM-H-x40
fold: fold_0
task: sthelar_full
gpus: auto
tune: 0                      # 0 = single run; N = auto-tune iterations

# markers
markers_csv: null            # null => kurtorank bundled default
top_k_markers: 25

# non-end-to-end cell classifier
# object_detection is the switch: end2end trains CellViT from tiles; anything
# else means an external detector supplies the cells at inference and only a
# crop classifier is trained here.
object_detection: end2end    # end2end | stardist
# The four below have no defaults on purpose: they decide the deployed model's
# geometry, and a wrong guess trains a model that scores well and predicts badly.
architecture: null           # any torchvision classifier, e.g. resnet50
patch_size_pixels: null
patch_spacing_um_px: null
stain_normalization: null
norm_sample_size: 256        # cells per slide used to estimate the stain matrix
# csbdeep normalize() defaults, stated explicitly so the exported model can
# tell wsinsight to detect with the percentiles this run segmented with.
stardist_normalization_pmin: 3.0
stardist_normalization_pmax: 99.8
epochs: 50
batch_size: 128
lr: 0.0001
weight_decay: 0.0001
pretrained: false            # start from torchvision's ImageNet weights
num_workers: 8
